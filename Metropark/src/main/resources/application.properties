# Also becomes the OpenTelemetry service.name and the Loki `app` label, so the
# value must match the dashboard queries exactly (no trailing whitespace).
spring.application.name=metropark
# spring.server.port=5180
# Standard JDBC Configuration 
spring.datasource.url=jdbc:postgresql://localhost:5432/metropark
spring.datasource.username=postgres
spring.datasource.password=21125@aaJV
spring.datasource.driver-class-name=org.postgresql.Driver

# Reactive R2DBC Configuration 
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/metropark
spring.r2dbc.username=postgres
spring.r2dbc.password=21125@aaJV

# --- ADD THE JOOQ DIALECT HERE ---
spring.jooq.sql-dialect=POSTGRES

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123
spring.rabbitmq.virtual-host=/
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2

# --- Actuator / Metrics (scraped by Prometheus at /actuator/prometheus) ---
# management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
# Publish percentile histograms so Grafana can compute real p95/p99 latency
# server-side; without this only pre-aggregated maxima are available.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.spring.data.repository.invocations=true
# Attach exemplars so Prometheus panels can deep-link into the matching trace.
management.prometheus.metrics.export.properties.io.prometheus.exporter.exemplarsOnAllMetricTypes=true

# spring-boot-starter-opentelemetry also brings micrometer-registry-otlp. Left  
# enabled it would push every meter to the collector on top of the Prometheus
# scrape above, so each metric would land in Prometheus twice under different
# label sets. Prometheus scraping the actuator endpoint is the single path for
# application metrics; the collector's job is traces and span-derived metrics.  
management.otlp.metrics.export.enabled=false

# --- Tracing (OTLP -> OpenTelemetry Collector -> Jaeger) ---
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.otlp.tracing.transport=http
# Enables Micrometer's @Observed support alongside the TracingAspect.
management.observations.annotations.enabled=true

# --- Logging ---
logging.level.root=INFO
logging.level.com.example.Metropark=INFO
# traceID/spanID in the pattern are what tie Loki lines back to Jaeger traces;
# the Grafana Loki datasource extracts them with the regex traceID=([0-9a-f]+).
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceID=%X{traceId:-} spanID=%X{spanId:-}] %logger{36} - %msg%n
logging.pattern.file=${logging.pattern.console}
logging.file.name=logs/metropark.log