spring.application.name=Metropark 

# Standard JDBC Configuration 
spring.datasource.url=jdbc:postgresql://localhost:5432/metropark
spring.datasource.username=postgres
spring.datasource.password=21125@aaJV
spring.datasource.driver-class-name=org.postgresql.Driver

# Reactive R2DBC Configuration 
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/metropark
spring.r2dbc.username=postgres
spring.r2dbc.password=21125@aaJV

# --- ADD THE JOOQ DIALECT HERE ---
spring.jooq.sql-dialect=POSTGRES

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123
spring.rabbitmq.virtual-host=/
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2

# Logging
logging.level.root=INFO
logging.level.com.example.Metropark=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=logs/metropark.log