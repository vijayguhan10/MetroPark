global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "metropark"
    environment: "development"

scrape_configs:
  # Application metrics (JVM, HTTP server, and the custom metropark.* meters)
  # exposed by Spring Boot Actuator. The app runs on the host, not in compose.
  - job_name: "metropark-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: "metropark"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "metropark-app"

  # Span-derived RED metrics plus any OTLP metrics forwarded by the collector.
  - job_name: "otel-collector-pipeline"
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own health (queue sizes, refused/dropped spans).
  - job_name: "otel-collector-internal"
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: "jaeger"
    static_configs:
      - targets: ["jaeger:14269"]

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
